# OrcaPad — minimal iPad app around the OrcaSlicer core (Phase 1 of the iPad port).
# Regenerate the Xcode project with:  cd ios-app && xcodegen generate
name: OrcaPad
options:
  bundleIdPrefix: com.youblue
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  OrcaPad:
    type: application
    platform: iOS
    sources:
      - Sources
      # System printer/process/filament profiles + misc data the core reads
      # from its resources dir (bundled as folder references).
      - path: ../resources/profiles
        type: folder
        buildPhase: resources
      - path: ../resources/info
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/OrcaCore.xcframework
        embed: false
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Landscape-only: the three-pane layout wants the width, and
        # orientation locking on iPad requires opting out of multitasking.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3D Model
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.youblue.orcapad.stl
              - com.youblue.orcapad.step
              - com.youblue.orcapad.3mf
              - com.youblue.orcapad.obj
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.youblue.orcapad.stl
            UTTypeDescription: STL Model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [stl]}
          - UTTypeIdentifier: com.youblue.orcapad.step
            UTTypeDescription: STEP Model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [step, stp]}
          - UTTypeIdentifier: com.youblue.orcapad.3mf
            UTTypeDescription: 3MF Model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [3mf]}
          - UTTypeIdentifier: com.youblue.orcapad.obj
            UTTypeDescription: OBJ Model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [obj]}
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/OrcaPad-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        # The bridge translation unit compiles against the libslic3r headers.
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../src"
          - "$(SRCROOT)/../deps_src"
          - "$(SRCROOT)/../deps_src/nanosvg"
          - "$(SRCROOT)/../build/ios/src"
          - "$(SRCROOT)/../build/ios/src/libslic3r"
          - "$(SRCROOT)/../deps/build/ios/OrcaSlicer_dep_ios/usr/local/include"
          - "$(SRCROOT)/../deps/build/ios/OrcaSlicer_dep_ios/usr/local/include/eigen3"
          - "$(SRCROOT)/../deps/build/ios/OrcaSlicer_dep_ios/usr/local/include/opencascade"
          - "$(SRCROOT)/../deps/build/ios/OrcaSlicer_dep_ios/usr/local/include/opencv4"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "ORCA_CORE_ONLY=1"
          - "USE_TBB=1"
          - "TBB_USE_CAPTURED_EXCEPTION=0"
          - "BOOST_ALL_NO_LIB=1"
        OTHER_LDFLAGS:
          - "-lz"
          - "-liconv"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "ModelIO"
